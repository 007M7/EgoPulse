name: foundation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  typescript-and-contracts:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm --filter @egopulse/desktop run build

  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --project workers/foundation-probe --frozen
      - run: uv run --project workers/foundation-probe --frozen pytest workers/foundation-probe --rootdir workers/foundation-probe
      - run: uv sync --project workers/contract-bindings --frozen
      - run: uv run --project workers/contract-bindings --frozen pytest workers/contract-bindings --rootdir workers/contract-bindings
