version: v2
modules:
  - path: contracts/proto
lint:
  use:
    - STANDARD
  except:
    # Gate 3 accepted reusable command/result and stream envelope names. These
    # exceptions are deliberately identical to contracts/buf.yaml and must not
    # be broadened without a contract revision.
    - RPC_REQUEST_STANDARD_NAME
    - RPC_RESPONSE_STANDARD_NAME
breaking:
  use:
    - FILE
