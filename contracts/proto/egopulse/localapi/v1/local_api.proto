syntax = "proto3";

package egopulse.localapi.v1;

import "egopulse/artifact/v1/artifact.proto";
import "egopulse/collaboration/v1/collaboration.proto";
import "egopulse/common/v1/common.proto";
import "egopulse/harness/v1/harness.proto";
import "egopulse/memory/v1/memory.proto";
import "egopulse/policy/v1/policy.proto";
import "egopulse/task/v1/task.proto";
import "egopulse/verdict/v1/verdict.proto";
import "egopulse/verification/v1/verification.proto";
import "google/protobuf/timestamp.proto";

// Presentation/audit metadata only. It MUST NOT select capabilities or authorization.
enum ClientSurface {
  CLIENT_SURFACE_UNSPECIFIED = 0;
  CLIENT_SURFACE_DESKTOP = 1;
  CLIENT_SURFACE_CLI = 2;
  CLIENT_SURFACE_TUI = 3;
}

enum ProjectionHealth {
  PROJECTION_HEALTH_UNSPECIFIED = 0;
  PROJECTION_HEALTH_READY = 1;
  PROJECTION_HEALTH_CATCHING_UP = 2;
  PROJECTION_HEALTH_REBUILDING = 3;
  PROJECTION_HEALTH_HELD = 4;
  PROJECTION_HEALTH_INTEGRITY_FAILED = 5;
}

enum SourceDomain {
  SOURCE_DOMAIN_UNSPECIFIED = 0;
  SOURCE_DOMAIN_TASK = 1;
  SOURCE_DOMAIN_COLLABORATION = 2;
  SOURCE_DOMAIN_ARTIFACT = 3;
  SOURCE_DOMAIN_VERIFICATION = 4;
  SOURCE_DOMAIN_FOUNDER_VERDICT = 5;
  SOURCE_DOMAIN_POLICY_DECISION = 6;
  // Candidate facts from the Adapter durable edge; this does not grant
  // Authority ownership to the Adapter.
  SOURCE_DOMAIN_HARNESS_ADAPTER = 7;
}

enum StreamFrameKind {
  STREAM_FRAME_KIND_UNSPECIFIED = 0;
  STREAM_FRAME_KIND_SNAPSHOT = 1;
  STREAM_FRAME_KIND_HEARTBEAT = 2;
  STREAM_FRAME_KIND_RESET_REQUIRED = 3;
}

enum HarnessContentResetReason {
  HARNESS_CONTENT_RESET_REASON_UNSPECIFIED = 0;
  HARNESS_CONTENT_RESET_REASON_CURSOR_EXPIRED = 1;
  HARNESS_CONTENT_RESET_REASON_EPOCH_CHANGED = 2;
  HARNESS_CONTENT_RESET_REASON_PROFILE_CHANGED = 3;
  HARNESS_CONTENT_RESET_REASON_RETENTION_COMPACTED = 4;
  HARNESS_CONTENT_RESET_REASON_BASELINE_UNAVAILABLE = 5;
  HARNESS_CONTENT_RESET_REASON_INTEGRITY_RECOVERY = 6;
}

enum AvailableActionKind {
  AVAILABLE_ACTION_KIND_UNSPECIFIED = 0;
  AVAILABLE_ACTION_KIND_CREATE_TASK = 1;
  AVAILABLE_ACTION_KIND_REQUEST_CANCELLATION = 2;
  AVAILABLE_ACTION_KIND_RESUME_TASK = 3;
  AVAILABLE_ACTION_KIND_REVISE_TASK = 4;
  AVAILABLE_ACTION_KIND_DECIDE_HARNESS_APPROVAL = 5;
  AVAILABLE_ACTION_KIND_SUBMIT_FOUNDER_VERDICT = 6;
}

// Public governance projection only. Context bytes, private descriptor fields,
// owner identity, evidence and confirmation proof never cross this boundary.
enum ContextGovernanceState {
  CONTEXT_GOVERNANCE_STATE_UNSPECIFIED = 0;
  CONTEXT_GOVERNANCE_STATE_ISSUED = 1;
  CONTEXT_GOVERNANCE_STATE_REVOKED = 2;
}

enum LocalApiErrorCode {
  LOCAL_API_ERROR_CODE_UNSPECIFIED = 0;
  LOCAL_API_ERROR_CODE_INVALID_ARGUMENT = 1;
  LOCAL_API_ERROR_CODE_UNAUTHENTICATED = 2;
  LOCAL_API_ERROR_CODE_PERMISSION_DENIED = 3;
  LOCAL_API_ERROR_CODE_NOT_FOUND = 4;
  LOCAL_API_ERROR_CODE_CONTRACT_INCOMPATIBLE = 5;
  LOCAL_API_ERROR_CODE_SESSION_EXPIRED = 6;
  LOCAL_API_ERROR_CODE_CURSOR_INVALID = 7;
  LOCAL_API_ERROR_CODE_CURSOR_EXPIRED = 8;
  LOCAL_API_ERROR_CODE_PROJECTION_BEHIND = 9;
  LOCAL_API_ERROR_CODE_PROJECTION_RESET_REQUIRED = 10;
  LOCAL_API_ERROR_CODE_PROJECTION_HELD = 11;
  LOCAL_API_ERROR_CODE_INTEGRITY_FAILURE = 12;
  LOCAL_API_ERROR_CODE_DEADLINE_EXCEEDED = 13;
  LOCAL_API_ERROR_CODE_AUTHORITY_UNAVAILABLE = 14;
  LOCAL_API_ERROR_CODE_UNKNOWN_CRITICAL_SEMANTICS = 15;
  LOCAL_API_ERROR_CODE_RESOURCE_EXHAUSTED = 16;
  LOCAL_API_ERROR_CODE_COGNITION_WORKER_UNAVAILABLE = 17;
  LOCAL_API_ERROR_CODE_OWNER_MISMATCH = 18;
  LOCAL_API_ERROR_CODE_CONTEXT_REVOKED = 19;
  LOCAL_API_ERROR_CODE_STATE_REVISION_CONFLICT = 20;
  LOCAL_API_ERROR_CODE_IDEMPOTENCY_CONFLICT = 21;
}

message ClientRequestMetadata {
  string request_id = 1;
  string client_instance_id = 2;
  ClientSurface surface = 3;
  string session_id = 4;
  egopulse.common.v1.ContractReference api_contract_ref = 5;
  optional string correlation_id = 6;
}

message ProjectionPosition {
  string epoch = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp projected_at = 3;
}

message SourceRevision {
  SourceDomain domain = 1;
  string aggregate_id = 2;
  uint64 revision = 3;
  string last_event_id = 4;
}

message ProjectionMetadata {
  egopulse.common.v1.ContractReference schema_ref = 1;
  ProjectionPosition position = 2;
  repeated SourceRevision source_revisions = 3;
  ProjectionHealth health = 4;
  bool stale = 5;
  optional string safe_health_reason_code = 6;
}

message RedactedField {
  string field_path = 1;
  string reason_code = 2;
}

message AvailableAction {
  AvailableActionKind kind = 1;
  string owning_authority = 2;
  string derivation_rule_ref = 3;
  bool explicit_confirmation_required = 4;
  optional string reason_code = 5;
}

message TaskView {
  ProjectionMetadata metadata = 1;
  egopulse.task.v1.TaskSnapshot task = 2;
  egopulse.collaboration.v1.CollaborationSnapshot collaboration = 3;
  egopulse.artifact.v1.ArtifactSet artifact_set = 4;
  egopulse.verification.v1.VerificationArtifact verification = 5;
  egopulse.verdict.v1.FounderVerdict founder_verdict = 6;
  egopulse.verdict.v1.FounderVerdictState founder_verdict_state = 7;
  repeated AvailableAction available_actions = 8;
  repeated RedactedField redactions = 9;
}

message EvidenceGraphView {
  ProjectionMetadata metadata = 1;
  string task_id = 2;
  string artifact_set_id = 3;
  repeated egopulse.artifact.v1.ArtifactDescriptor artifacts = 4;
  repeated egopulse.artifact.v1.Claim claims = 5;
  repeated egopulse.artifact.v1.Evidence evidence = 6;
  repeated RedactedField redactions = 7;
}

// User-facing preparation input. The client supplies only natural-language
// intent, reviewed work classification, scope and explicit source references;
// the daemon compiles and verifies the authoritative context envelope.
message WorkSourceRequest {
  string source_ref = 1;
  string label = 2;
}

// Authority-owned source fact returned in a preparation preview. The client
// may request a source, but cannot author its authority or content digest.
message WorkSourceFact {
  string source_ref = 1;
  string label = 2;
  string authority = 3;
  string content_sha256 = 4;
  bool included = 5;
}

message WorkGateNotice {
  string code = 1;
  string detail = 2;
  string source_ref = 3;
}

// Sanitized, Authority-owned preparation result. Raw compiled context,
// credentials, process configuration and client-selected authority fields are
// never returned here.
message WorkPreparationPreview {
  string snapshot_id = 1;
  uint64 snapshot_revision = 2;
  string normalized_intent = 3;
  string work_type = 4;
  string target_scope_ref = 5;
  string compiled_context_sha256 = 6;
  repeated WorkSourceFact included_sources = 7;
  repeated WorkGateNotice excluded_sources = 8;
  repeated string non_goals = 9;
  repeated string allowed_read_paths = 10;
  repeated string allowed_write_paths = 11;
  repeated string allowed_tools = 12;
  repeated string external_resources = 13;
  egopulse.common.v1.ContractReference acceptance_contract_ref = 14;
  egopulse.common.v1.ContractReference budget_profile_ref = 15;
  optional uint64 memory_authority_revision = 16;
  optional string memory_pack_snapshot_sha256 = 17;
  string recovery_entry = 18;
  string visibility = 19;
  repeated RedactedField redactions = 20;
  google.protobuf.Timestamp expires_at = 21;
  string confirmation_binding_sha256 = 22;
  // Both fields are true only when the Authority-owned preparation gate is
  // clear; neither means that a Task has been created or dispatched.
  bool gate_ready = 23;
  repeated WorkGateNotice blockers = 24;
  repeated WorkGateNotice warnings = 25;
  repeated string required_confirmations = 26;
  repeated string evidence_required = 27;
  bool ready_for_founder_confirmation = 28;
  google.protobuf.Timestamp deadline = 29;
  // Independent governance CAS read from Context Authority. It is not the
  // immutable snapshot revision and MUST NOT be reconstructed by a client.
  uint64 context_state_revision = 30;
}

message PrepareWorkRequest {
  ClientRequestMetadata client = 1;
  string intent = 2;
  string work_type = 3;
  string target_scope_ref = 4;
  repeated WorkSourceRequest sources = 5;
  string idempotency_key = 6;
}

message PrepareWorkResponse {
  oneof outcome {
    WorkPreparationPreview preview = 1;
    LocalApiError error = 2;
  }
}

message ConfirmWorkRequest {
  ClientRequestMetadata client = 1;
  string snapshot_id = 2;
  string confirmation_binding_sha256 = 3;
  string idempotency_key = 4;
}

message ConfirmWorkAccepted {
  egopulse.task.v1.TaskCommandResult authority_result = 1;
  ProjectionAwaitToken await_token = 2;
}

message ConfirmWorkResponse {
  oneof outcome {
    ConfirmWorkAccepted accepted = 1;
    LocalApiError error = 2;
  }
}

// Sanitized Authority result safe for Local API clients. The owning Policy
// Authority remains the source of this result; native routing and proof
// internals are deliberately absent.
message HarnessApprovalAuthorityResult {
  bool committed = 1;
  bool replayed = 2;
  string authority_decision_ref = 3;
  egopulse.harness.v1.ApprovalDecision decision = 4;
  egopulse.policy.v1.HarnessApprovalDecisionStateKind state = 5;
  uint64 state_revision = 6;
  google.protobuf.Timestamp expires_at = 7;
  egopulse.policy.v1.PolicyDecisionErrorCode error_code = 8;
  optional string safe_error_fingerprint = 9;
}

message HarnessApprovalDecisionView {
  string authority_decision_ref = 1;
  egopulse.harness.v1.ApprovalDecision decision = 2;
  string reason_code = 3;
  egopulse.policy.v1.HarnessApprovalDecisionStateKind state = 4;
  uint64 state_revision = 5;
  google.protobuf.Timestamp issued_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

// Rebuildable projection joining an Adapter-owned request with an optional
// Policy-owned decision. Native routing, raw prompt/command, credentials and
// store handles are never part of this view.
message HarnessApprovalView {
  ProjectionMetadata metadata = 1;
  string approval_request_id = 2;
  string task_id = 3;
  string run_id = 4;
  string step_id = 5;
  string attempt_id = 6;
  string dispatch_id = 7;
  uint64 fencing_token = 8;
  egopulse.harness.v1.ApprovalKind kind = 9;
  string action_digest_sha256 = 10;
  string requested_scope_ref = 11;
  string display_summary_ref = 12;
  string request_observation_id = 13;
  uint64 request_observation_sequence = 14;
  egopulse.harness.v1.ApprovalRequestLifecycleKind request_lifecycle = 15;
  uint64 request_revision = 16;
  HarnessApprovalDecisionView policy_decision = 17;
  repeated AvailableAction available_actions = 18;
  repeated RedactedField redactions = 19;
}

// Independent content-domain position. It must not be compared with the Task,
// Approval or OpenSession projection position even when values happen to match.
message HarnessContentPosition {
  string epoch = 1;
  uint64 sequence = 2;
  google.protobuf.Timestamp projected_at = 3;
}

message HarnessAssistantTextView {
  string safe_message_id = 1;
  uint64 revision = 2;
  uint64 previous_revision = 3;
  egopulse.harness.v1.ContentMutationOperation operation = 4;
  string safe_text_utf8 = 5;
  string safe_cumulative_digest_sha256 = 6;
  uint32 part_index = 7;
  uint32 part_count = 8;
  bool provisional = 9;
}

message HarnessLifecycleContentView {
  egopulse.harness.v1.LifecycleKind kind = 1;
  egopulse.harness.v1.SideEffectCertainty side_effect_certainty = 2;
  optional bool native_will_retry = 3;
}

message HarnessUsageContentView {
  uint64 input_tokens = 1;
  uint64 output_tokens = 2;
  optional uint64 cached_input_tokens = 3;
}

// Request identity/details remain in the separately authorized Approval stream.
message HarnessApprovalRequiredContentView {}

message HarnessArtifactIdentityView {
  string artifact_id = 1;
  string artifact_digest_sha256 = 2;
}

message HarnessArtifactAvailableRedactedView {}

message HarnessArtifactRelationView {
  bool safe_content_differs_from_artifact = 1;
  oneof visibility {
    HarnessArtifactIdentityView available = 2;
    HarnessArtifactAvailableRedactedView available_redacted = 3;
  }
}

message HarnessContentMarkerView {
  egopulse.harness.v1.HarnessContentMarkerKind kind = 1;
  // LIMIT_REACHED exposes the deterministic winning bound; every other
  // marker carries UNSPECIFIED. The Local API must not force clients to infer
  // this Authority-owned disclosure fact from counters or record position.
  egopulse.harness.v1.HarnessContentLimitKind limit_kind = 2;
}

// Public, post-disclosure DTO. Raw/native identifiers, raw evidence, route
// binding, raw cumulative digests and credential commitments are intentionally
// absent.
message HarnessContentRecordView {
  string record_id = 1;
  string record_digest_sha256 = 2;
  uint64 content_sequence = 3;
  string task_id = 4;
  string attempt_id = 5;
  string provider_family_alias = 6;
  string model_alias = 7;
  string collaboration_role = 8;
  egopulse.common.v1.ContractReference disclosure_profile_ref = 9;
  google.protobuf.Timestamp projected_at = 10;
  repeated egopulse.harness.v1.HarnessContentSafetyFlag safety_flags = 11;
  oneof payload {
    HarnessAssistantTextView assistant_text = 20;
    HarnessLifecycleContentView lifecycle = 21;
    HarnessUsageContentView usage = 22;
    HarnessApprovalRequiredContentView approval_required = 23;
    HarnessArtifactRelationView artifact_relation = 24;
    HarnessContentMarkerView marker = 25;
  }
}

message ListHarnessContentRequest {
  ClientRequestMetadata client = 1;
  string task_id = 2;
  repeated string attempt_ids = 3;
  uint32 page_size = 4;
  optional string page_cursor = 5;
  // Required on every page after the first so pagination cannot drift to a
  // newer content position.
  HarnessContentPosition snapshot_position = 6;
}

message HarnessContentBaselinePage {
  repeated HarnessContentRecordView records = 1;
  optional string next_page_cursor = 2;
  bool has_more = 3;
  HarnessContentPosition snapshot_position = 4;
  uint64 retained_from_sequence = 5;
  egopulse.common.v1.ContractReference disclosure_profile_ref = 6;
}

message ListHarnessContentResponse {
  oneof outcome {
    HarnessContentBaselinePage page = 1;
    LocalApiError error = 2;
  }
}

message WatchHarnessContentRequest {
  ClientRequestMetadata client = 1;
  string task_id = 2;
  repeated string attempt_ids = 3;
  HarnessContentPosition resume_after = 4;
}

message HarnessContentRecordsFrame {
  repeated HarnessContentRecordView records = 1;
}

message HarnessContentHeartbeatFrame {}

message HarnessContentResetRequiredFrame {
  HarnessContentResetReason reason = 1;
}

message HarnessContentStreamFrame {
  HarnessContentPosition position = 1;
  oneof payload {
    HarnessContentRecordsFrame records = 2;
    HarnessContentHeartbeatFrame heartbeat = 3;
    HarnessContentResetRequiredFrame reset_required = 4;
  }
}

message LocalApiError {
  LocalApiErrorCode code = 1;
  string safe_fingerprint = 2;
  bool retryable = 3;
  optional string required_action_code = 4;
  ProjectionPosition current_position = 5;
  string correlation_id = 6;
}

message OpenSessionRequest {
  string request_id = 1;
  string client_instance_id = 2;
  ClientSurface surface = 3;
  repeated egopulse.common.v1.ContractReference supported_contracts = 4;
}

message OpenSessionResponse {
  string session_id = 1;
  string authenticated_principal_id = 2;
  egopulse.common.v1.ContractReference negotiated_contract_ref = 3;
  repeated string granted_permission_codes = 4;
  google.protobuf.Timestamp expires_at = 5;
  ProjectionPosition current_position = 6;
  LocalApiError error = 7;
  egopulse.common.v1.ContractReference client_kernel_contract_ref = 8;
  egopulse.common.v1.ContractReference authorization_policy_ref = 9;
}

message GetTaskViewRequest {
  ClientRequestMetadata client = 1;
  string task_id = 2;
  ProjectionPosition minimum_position = 3;
}

message GetTaskViewResponse {
  oneof outcome {
    TaskView view = 1;
    LocalApiError error = 2;
  }
}

message ListTaskViewsRequest {
  ClientRequestMetadata client = 1;
  repeated egopulse.task.v1.TaskStatus status_filter = 2;
  uint32 page_size = 3;
  optional string page_cursor = 4;
  ProjectionPosition minimum_position = 5;
}

message ListTaskViewsResponse {
  repeated TaskView views = 1;
  optional string next_page_cursor = 2;
  ProjectionPosition snapshot_position = 3;
  LocalApiError error = 4;
}

message GetEvidenceGraphRequest {
  ClientRequestMetadata client = 1;
  string task_id = 2;
  string artifact_set_id = 3;
  ProjectionPosition minimum_position = 4;
}

message GetEvidenceGraphResponse {
  oneof outcome {
    EvidenceGraphView graph = 1;
    LocalApiError error = 2;
  }
}

message GetHarnessApprovalViewRequest {
  ClientRequestMetadata client = 1;
  string approval_request_id = 2;
  ProjectionPosition minimum_position = 3;
}

message GetHarnessApprovalViewResponse {
  oneof outcome {
    HarnessApprovalView view = 1;
    LocalApiError error = 2;
  }
}

message ListHarnessApprovalViewsRequest {
  ClientRequestMetadata client = 1;
  repeated egopulse.harness.v1.ApprovalRequestLifecycleKind request_lifecycle_filter = 2;
  repeated egopulse.policy.v1.HarnessApprovalDecisionStateKind decision_state_filter = 3;
  repeated string task_ids = 4;
  bool actionable_only = 5;
  uint32 page_size = 6;
  optional string page_cursor = 7;
  ProjectionPosition minimum_position = 8;
}

message ListHarnessApprovalViewsResponse {
  repeated HarnessApprovalView views = 1;
  optional string next_page_cursor = 2;
  ProjectionPosition snapshot_position = 3;
  LocalApiError error = 4;
}

message GetProjectionStatusRequest {
  ClientRequestMetadata client = 1;
}

message GetProjectionStatusResponse {
  ProjectionMetadata metadata = 1;
  LocalApiError error = 2;
}

message WatchTaskViewsRequest {
  ClientRequestMetadata client = 1;
  ProjectionPosition resume_after = 2;
  repeated string task_ids = 3;
  repeated egopulse.task.v1.TaskStatus status_filter = 4;
}

message TaskViewStreamFrame {
  StreamFrameKind kind = 1;
  ProjectionPosition position = 2;
  TaskView snapshot = 3;
  optional string reset_reason_code = 4;
}

message WatchHarnessApprovalViewsRequest {
  ClientRequestMetadata client = 1;
  ProjectionPosition resume_after = 2;
  repeated string approval_request_ids = 3;
  repeated string task_ids = 4;
  repeated egopulse.harness.v1.ApprovalRequestLifecycleKind request_lifecycle_filter = 5;
  repeated egopulse.policy.v1.HarnessApprovalDecisionStateKind decision_state_filter = 6;
  bool actionable_only = 7;
}

message HarnessApprovalViewStreamFrame {
  StreamFrameKind kind = 1;
  ProjectionPosition position = 2;
  HarnessApprovalView snapshot = 3;
  optional string reset_reason_code = 4;
}

message ProjectionAwaitToken {
  string token = 1;
  SourceRevision required_source_revision = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message ExecuteTaskCommandRequest {
  ClientRequestMetadata client = 1;
  egopulse.task.v1.TaskCommand command = 2;
}

message ExecuteTaskCommandResponse {
  egopulse.task.v1.TaskCommandResult authority_result = 1;
  ProjectionAwaitToken await_token = 2;
  LocalApiError gateway_error = 3;
}

message DecideHarnessApprovalRequest {
  ClientRequestMetadata client = 1;
  reserved 2;
  reserved "decision";
  egopulse.policy.v1.IssueHarnessApprovalDecisionCommand command = 3;
}

message DecideHarnessApprovalResponse {
  reserved 1;
  reserved "authority_result";
  ProjectionAwaitToken await_token = 2;
  LocalApiError gateway_error = 3;
  // Kept for draft.12 wire compatibility but MUST remain unset because the
  // full Authority result contains Adapter-native routing/proof internals.
  egopulse.policy.v1.PolicyDecisionCommandResult policy_authority_result = 4 [deprecated = true];
  HarnessApprovalAuthorityResult sanitized_authority_result = 5;
}

message ExecuteFounderVerdictRequest {
  ClientRequestMetadata client = 1;
  egopulse.verdict.v1.VerdictCommand command = 2;
}

message ExecuteFounderVerdictResponse {
  egopulse.verdict.v1.VerdictCommandResult authority_result = 1;
  ProjectionAwaitToken await_token = 2;
  LocalApiError gateway_error = 3;
}

// Memory writes cross the Local API only as explicit, owner-checked commands.
// A candidate submission never makes a record authoritative; accept and revoke
// remain separate Founder-governed operations in the Memory Authority.
message SubmitMemoryCandidateCommand {
  ClientRequestMetadata metadata = 1;
  string memory_id = 2;
  string content = 3;
  string source_ref = 4;
  string scope_ref = 5;
  string idempotency_key = 6;
}

message AcceptMemoryCommand {
  ClientRequestMetadata metadata = 1;
  string memory_id = 2;
  uint64 expected_revision = 3;
  string evidence_ref = 4;
  string idempotency_key = 5;
}

message RevokeMemoryCommand {
  ClientRequestMetadata metadata = 1;
  string memory_id = 2;
  uint64 expected_revision = 3;
  string evidence_ref = 4;
  string idempotency_key = 5;
}

message MemoryMutationCommand {
  oneof command {
    SubmitMemoryCandidateCommand submit_memory_candidate = 1;
    AcceptMemoryCommand accept_memory = 2;
    RevokeMemoryCommand revoke_memory = 3;
  }
}

message MemoryMutationReceipt {
  string memory_id = 1;
  uint64 revision = 2;
  string state = 3;
  string event_id = 4;
  string request_digest_sha256 = 5;
  bool acknowledged_after_durability_barrier = 6;
}

message ExecuteMemoryMutationRequest {
  ClientRequestMetadata client = 1;
  MemoryMutationCommand command = 2;
}

message ExecuteMemoryMutationResponse {
  MemoryMutationReceipt authority_result = 1;
  LocalApiError gateway_error = 2;
}

// The authenticated Founder owner is deliberately absent. The gateway derives
// it from the validated local session and Context Authority revalidates it.
message RevokeContextSnapshotCommand {
  // request_digest_sha256 is the required full lower-case 64-hex confirmation
  // digest. The semantic profile excludes all other CommandMetadata fields.
  egopulse.common.v1.CommandMetadata metadata = 1;
  string snapshot_id = 2;
  uint64 expected_state_revision = 3;
  string reason_code = 4;
  repeated string evidence_refs = 5;
  string confirmation_proof_ref = 6;
}

message ContextMutationCommand {
  oneof command {
    RevokeContextSnapshotCommand revoke_context_snapshot = 1;
  }
}

// Sanitized Context Authority receipt. Raw Context bytes, descriptor content,
// owner principal, reason, evidence and confirmation proof are forbidden.
message ContextRevokeReceipt {
  string snapshot_id = 1;
  uint64 snapshot_revision = 2;
  string content_digest_sha256 = 3;
  uint64 previous_state_revision = 4;
  uint64 result_state_revision = 5;
  ContextGovernanceState previous_state = 6;
  ContextGovernanceState result_state = 7;
  string request_digest_sha256 = 8;
  string event_id = 9;
  google.protobuf.Timestamp committed_at = 10;
  bool replayed = 11;
  bool acknowledged_after_durability_barrier = 12;
}

message ExecuteContextMutationRequest {
  ClientRequestMetadata client = 1;
  ContextMutationCommand command = 2;
}

message ExecuteContextMutationResponse {
  // Success and failure are wire-level mutually exclusive. The neutral error
  // branch carries gateway or Context Authority failures without fabricating a
  // partial success receipt.
  oneof outcome {
    ContextRevokeReceipt authority_result = 1;
    LocalApiError error = 2;
  }
}

message AwaitProjectionRequest {
  ClientRequestMetadata client = 1;
  ProjectionAwaitToken await_token = 2;
  uint32 timeout_milliseconds = 3;
}

message AwaitProjectionResponse {
  oneof outcome {
    TaskView view = 1;
    LocalApiError error = 2;
    HarnessApprovalView approval_view = 3;
  }
}

// Read-only cognition-plane request. The client supplies intent and bounds;
// the daemon binds the request to an authenticated principal, an authorized
// scope, and one accepted Memory snapshot before invoking a Worker.
message RetrieveMemoryRequest {
  ClientRequestMetadata client = 1;
  string query = 2;
  string scope_ref = 3;
  uint32 max_results = 4;
  double min_score = 5;
}

message RetrieveMemoryResponse {
  oneof outcome {
    egopulse.memory.v1.RetrievalResponse result = 1;
    LocalApiError error = 2;
  }
}

service LocalSessionService {
  rpc OpenSession(OpenSessionRequest) returns (OpenSessionResponse);
}

service LocalReadModelService {
  rpc GetTaskView(GetTaskViewRequest) returns (GetTaskViewResponse);
  rpc ListTaskViews(ListTaskViewsRequest) returns (ListTaskViewsResponse);
  rpc GetEvidenceGraph(GetEvidenceGraphRequest) returns (GetEvidenceGraphResponse);
  rpc GetHarnessApprovalView(GetHarnessApprovalViewRequest) returns (GetHarnessApprovalViewResponse);
  rpc ListHarnessApprovalViews(ListHarnessApprovalViewsRequest) returns (ListHarnessApprovalViewsResponse);
  rpc GetProjectionStatus(GetProjectionStatusRequest) returns (GetProjectionStatusResponse);
  rpc WatchTaskViews(WatchTaskViewsRequest) returns (stream TaskViewStreamFrame);
  rpc WatchHarnessApprovalViews(WatchHarnessApprovalViewsRequest) returns (stream HarnessApprovalViewStreamFrame);
  rpc ListHarnessContent(ListHarnessContentRequest) returns (ListHarnessContentResponse);
  rpc WatchHarnessContent(WatchHarnessContentRequest) returns (stream HarnessContentStreamFrame);
  rpc AwaitProjection(AwaitProjectionRequest) returns (AwaitProjectionResponse);
}

service LocalCommandGatewayService {
  rpc PrepareWork(PrepareWorkRequest) returns (PrepareWorkResponse);
  rpc ConfirmWork(ConfirmWorkRequest) returns (ConfirmWorkResponse);
  rpc ExecuteTaskCommand(ExecuteTaskCommandRequest) returns (ExecuteTaskCommandResponse);
  rpc DecideHarnessApproval(DecideHarnessApprovalRequest) returns (DecideHarnessApprovalResponse);
  rpc ExecuteFounderVerdict(ExecuteFounderVerdictRequest) returns (ExecuteFounderVerdictResponse);
  rpc ExecuteMemoryMutation(ExecuteMemoryMutationRequest) returns (ExecuteMemoryMutationResponse);
  rpc ExecuteContextMutation(ExecuteContextMutationRequest) returns (ExecuteContextMutationResponse);
}

service LocalCognitionService {
  rpc RetrieveMemory(RetrieveMemoryRequest) returns (RetrieveMemoryResponse);
}
