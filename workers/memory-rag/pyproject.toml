[project]
name = "egopulse-memory-rag-worker"
version = "0.1.0"
description = "Read-only deterministic retrieval candidate worker for EgoPulse"
requires-python = ">=3.14,<3.15"
dependencies = [
  "protobuf==7.35.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.2",
]

[tool.pytest.ini_options]
addopts = ["-p", "no:cacheprovider"]
pythonpath = ["src", "../contract-bindings/src"]
testpaths = ["tests"]

[tool.uv]
package = false
